name: Self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the release workflow scenarios
        run: bash test/release-workflows.sh
