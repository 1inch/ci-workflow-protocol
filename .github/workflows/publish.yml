name: Publish to npm

on:
  workflow_call:
    inputs:
      tag-prefix:
        description: Text in front of the package.json version in the tag, `v` for `v1.2.3` or empty for `1.2.3`
        type: string
        default: v
      dry-run:
        description: Run npm publish without publishing the package
        type: boolean
        default: false
      pack-only:
        description: Build and upload the package without publishing it, for the first version of a package that is not on npm yet
        type: boolean
        default: false
      move-next:
        description: After a release X.Y.Z, move the next dist-tag from a release candidate X.Y.Z-rc.N to the release. Needs Allow npm dist-tag on the package's trusted publisher
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release tag
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          version=$(jq -r .version package.json)
          tag="${TAG_PREFIX}${version}"
          if [ "$GITHUB_REF" != "refs/tags/${tag}" ]; then
            echo "::error::Run PUBLISH from the tag ${tag}, not from ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Check the release branch
        run: |
          release=${VERSION%-rc.*}
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/${release}"; then
            echo "::error::Tag commit ${GITHUB_SHA} is not on release/${release}"
            exit 1
          fi

      - name: Check CI on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}" --jq '[.workflow_runs[] | select(.name == "CI" and (.event == "push" or .event == "workflow_dispatch"))] | first | if . == null then "missing" else (.conclusion // .status) end')
          if [ "$ci" != "success" ]; then
            echo "::error::CI on ${GITHUB_SHA} is ${ci}. Run PUBLISH once CI has passed on this commit"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install node modules
        run: yarn install --frozen-lockfile

      # npm pack writes into an empty directory and only the file it wrote is uploaded: a '*.tgz' glob over the checkout would also take committed tarballs and symlinks.
      - name: Pack
        id: pack
        run: |
          destination=$(mktemp -d "${RUNNER_TEMP}/npm-package.XXXXXX")
          npm pack --pack-destination "$destination"
          entries=$(find "$destination" -mindepth 1 -maxdepth 1)
          if [ "$(printf '%s\n' "$entries" | grep -c .)" -ne 1 ] || [ ! -f "$entries" ] || [ -L "$entries" ] || [[ "$entries" != *.tgz ]]; then
            echo "::error::npm pack should write one tarball, it wrote: ${entries:-nothing}"
            exit 1
          fi
          package=$entries
          name=${package##*/}
          sha256=$(openssl dgst -sha256 "$package" | awk '{print $NF}')
          integrity="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
          echo "${name}: SHA-256 ${sha256}, npm integrity ${integrity}"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          {
            echo "| Package | SHA-256 | npm integrity |"
            echo "|---|---|---|"
            echo "| \`${name}\` | \`${sha256}\` | \`${integrity}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.package }}
          if-no-files-found: error

  npm:
    needs: build
    if: ${{ !inputs.pack-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: npm-package
          path: package

      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          entries=$(find ./package -mindepth 1 -maxdepth 1)
          if [ "$(printf '%s\n' "$entries" | grep -c .)" -ne 1 ] || [ ! -f "$entries" ] || [[ "$entries" != *.tgz ]]; then
            echo "::error::The npm-package artifact should hold one tarball, it holds: ${entries:-nothing}"
            exit 1
          fi
          package=$entries
          version=$(tar -xOf "$package" package/package.json | jq -r .version)
          args=("$package")
          if [[ "$version" == *-* ]]; then
            args+=(--tag next)
          fi
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          npm publish "${args[@]}"

      # The job installs nothing, so this runs on the npm of the latest Node 26: dist-tags with trusted publishing need
      # npm 11.21.0 or 12.2.0, and an older one leaves the command to a package admin.
      - name: Move next to the release
        if: ${{ inputs.move-next }}
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          package=$(find ./package -mindepth 1 -maxdepth 1)
          name=$(tar -xOf "$package" package/package.json | jq -r .name)
          version=$(tar -xOf "$package" package/package.json | jq -r .version)
          if [[ "$version" == *-* ]]; then
            exit 0
          fi
          npm_version=$(npm --version)
          IFS=. read -r major minor _ <<<"$npm_version"
          if (( major < 11 || (major == 11 && minor < 21) || (major == 12 && minor < 2) )); then
            echo "::warning::npm ${npm_version} cannot manage dist-tags with trusted publishing, which needs npm 11.21.0 or 12.2.0. If next is on a release candidate of ${version}, move it by hand: npm dist-tag add ${name}@${version} next"
            exit 0
          fi
          tags=$(npm dist-tag ls "$name")
          next=$(awk -F': ' '$1 == "next" { print $2 }' <<<"$tags")
          if [[ "$next" != "${version}-"* ]]; then
            echo "next is ${next:-not set}, not a release candidate of ${version}"
            exit 0
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: next would move from ${next} to ${version}"
            exit 0
          fi
          if ! npm dist-tag add "${name}@${version}" next; then
            echo "::error::${name}@${version} is published, but next is still on ${next}. Move it by hand: npm dist-tag add ${name}@${version} next"
            exit 1
          fi
