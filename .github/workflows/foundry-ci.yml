name: Foundry CI

on:
  workflow_call:
    inputs:
      foundry-version:
        description: Foundry version that every job installs
        type: string
        default: v1.5.1
      profile:
        description: Build profile that `yarn test` uses, for the artifact cache key
        type: string
        default: default
      sources:
        description: Contract source directory, for the artifact cache key
        type: string
        default: contracts
      snapshot:
        description: Run `yarn snapshot:check`
        type: boolean
        default: false
      lint:
        description: Run `yarn lint`
        type: boolean
        default: false
      typecheck:
        description: Run `yarn typecheck` in the `test` job, after the tests
        type: boolean
        default: false
      coverage:
        description: Run `yarn coverage` and upload the report to Codecov
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: Codecov upload token, read by the `coverage` job
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: $/.github/actions/setup
        with:
          submodules: recursive

      - uses: $/.github/actions/foundry
        with:
          version: ${{ inputs.foundry-version }}
          cache: true
          profile: ${{ inputs.profile }}
          sources: ${{ inputs.sources }}

      - name: Run tests
        run: yarn test

      - name: Run typecheck
        if: ${{ inputs.typecheck }}
        run: yarn typecheck

  snapshot:
    if: ${{ inputs.snapshot }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: $/.github/actions/setup
        with:
          submodules: recursive

      - uses: $/.github/actions/foundry
        with:
          version: ${{ inputs.foundry-version }}

      - name: Run snapshot check
        run: yarn snapshot:check

  lint:
    if: ${{ inputs.lint }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: $/.github/actions/setup
        with:
          submodules: recursive

      - uses: $/.github/actions/foundry
        with:
          version: ${{ inputs.foundry-version }}

      - name: Run linter
        run: yarn lint

  coverage:
    if: ${{ inputs.coverage }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: $/.github/actions/setup
        with:
          submodules: recursive

      - uses: $/.github/actions/foundry
        with:
          version: ${{ inputs.foundry-version }}

      - name: Run coverage
        run: yarn coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
