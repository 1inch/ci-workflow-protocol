name: Tag the package version

on:
  workflow_call:
    inputs:
      tag-prefix:
        description: Text in front of the package.json version in the tag, `v` for `v1.2.3` or empty for `1.2.3`
        type: string
        default: v

permissions:
  contents: write
  actions: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the release branch
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "release/${version}" ]; then
            echo "::error::Run TAG from release/${version}, the release branch of the version in package.json, not from ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=${TAG_PREFIX}${version}" >> "$GITHUB_ENV"

      - name: Check CI on the branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push" --jq '[.workflow_runs[] | select(.name == "CI")] | first | if . == null then "missing" else (.conclusion // .status) end')
          if [ "$ci" != "success" ]; then
            echo "::error::CI on ${GITHUB_SHA} is ${ci}. Run TAG once CI has passed on this commit in main"
            exit 1
          fi

      - name: Tag the version in package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" --silent
          echo "Tagged ${GITHUB_SHA} as ${TAG}"
