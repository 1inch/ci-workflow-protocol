name: Check package version

on:
  workflow_call:
    inputs:
      tag-prefix:
        description: Text in front of the version in the release tag, `v` for `v1.2.3` or empty for `1.2.3`
        type: string
        default: v

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Compare package.json with the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$BASE_REF" in
            release/*) expected="${BASE_REF#release/}" ;;
            *)
              echo "::error::The version check runs on pull requests into release/X.Y.Z, not into ${BASE_REF}"
              exit 1
              ;;
          esac
          tag="${TAG_PREFIX}${expected}"
          existing=$(git ls-remote --tags origin "refs/tags/${tag}")
          if [ -n "$existing" ]; then
            echo "::error::${tag} already exists, so ${BASE_REF} is frozen. Further changes go into a new release branch"
            exit 1
          fi
          version=$(jq -r .version package.json)
          base_version=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${BASE_SHA}" | jq -r .version)
          if [ "$version" != "$base_version" ] && [ "$version" != "$expected" ]; then
            echo "::error::This pull request sets the version to ${version}, but ${BASE_REF} releases ${expected}"
            exit 1
          fi
          echo "package.json has ${version}; ${tag} does not exist yet"
